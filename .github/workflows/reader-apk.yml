name: Build NeuroReader APK

on:
  push:
    branches: [reader-app]
    paths:
      - 'NeuroReader/**'
      - '.github/workflows/reader-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NeuroReader/**'
      - '.github/workflows/reader-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -L --fail --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-unpacked"
            mv "$RUNNER_TEMP/cmdline-unpacked/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          mkdir -p NeuroReader/app/libs
          curl -L --fail --retry 3 -o NeuroReader/app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar

      - name: Bundle stable Russian Piper voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p NeuroReader/app/src/main/assets/tts
          curl -L --fail --retry 3 \
            -o /tmp/piper-ru.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-irina-medium.tar.bz2
          tar -xjf /tmp/piper-ru.tar.bz2 -C NeuroReader/app/src/main/assets/tts
          MODEL=NeuroReader/app/src/main/assets/tts/vits-piper-ru_RU-irina-medium
          test -f "$MODEL/ru_RU-irina-medium.onnx"
          test -f "$MODEL/tokens.txt"
          test -f "$MODEL/espeak-ng-data/phontab"

      - name: Bundle offline Russian stress dictionary
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o NeuroReader/app/src/main/assets/tts/ru-stress-dict.txt \
            https://raw.githubusercontent.com/dbklim/StressRNN/master/stressrnn/dicts/exception_dictionary.txt
          test "$(wc -l < NeuroReader/app/src/main/assets/tts/ru-stress-dict.txt)" -gt 90000

      - name: Build debug APK
        working-directory: NeuroReader
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp NeuroReader/app/build/outputs/apk/debug/app-debug.apk NeuroReader-v6-Piper-Stable-arm64.apk
          sha256sum NeuroReader-v6-Piper-Stable-arm64.apk > NeuroReader-v6-Piper-Stable-arm64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroReader-v6-Piper-Stable-APK
          path: |
            NeuroReader-v6-Piper-Stable-arm64.apk
            NeuroReader-v6-Piper-Stable-arm64.apk.sha256
          retention-days: 30
