name: One-time storage cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep downloader, remove obsolete builds
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const mainArtifacts = artifacts
              .filter(a => (a.workflow_run?.head_branch || '') === 'main')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const keepId = mainArtifacts[0]?.id;
            for (const a of artifacts) {
              if (a.id !== keepId) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                  core.info(`Deleted artifact ${a.id} ${a.name}`);
                } catch (e) {
                  core.warning(`Artifact ${a.id}: ${e.message}`);
                }
              }
            }

            try {
              const caches = await github.paginate('GET /repos/{owner}/{repo}/actions/caches', { owner, repo, per_page: 100 });
              for (const c of caches) {
                try {
                  await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', { owner, repo, cache_id: c.id });
                } catch (e) {
                  core.warning(`Cache ${c.id}: ${e.message}`);
                }
              }
            } catch (e) {
              core.warning(`Cache listing: ${e.message}`);
            }

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/reader-app' });
              core.info('Deleted obsolete reader-app branch');
            } catch (e) {
              core.warning(`reader-app: ${e.message}`);
            }

            core.info(`Kept downloader main branch and ${keepId ? 'newest main artifact' : 'source only (no main artifact found)'}.`);
